[paths]
input = "input"
output = "output"
cache = "cache"
logs = "logs"
models = "models"

[tts]
engine = "edge"
voice = "ru-RU-DmitryNeural"
rate = "-5%"
pitch = "+0Hz"
volume = "+0%"
audio_format = "audio-24khz-48kbitrate-mono-mp3"
retries = 4
timeout_seconds = 90
socket_timeout_seconds = 30

[edge_queue]
# Conservative local pacing; this is not a statement of any Microsoft limit.
enabled = true
concurrency = 1
min_interval_ms = 3500
normal_jitter_min_ms = 0
normal_jitter_max_ms = 1500
max_requests_per_minute = 10
bucket_capacity = 1
adaptive_enabled = true
adaptive_min_interval_ms = 2500
adaptive_max_interval_ms = 12000
adaptive_successes_before_speedup = 5
adaptive_step_down_ms = 250
adaptive_rate_limit_multiplier = 1.5
transient_max_attempts = 3
transient_base_backoff_ms = 2000
transient_max_backoff_ms = 30000
retry_jitter = "equal"
# Local conservative recovery policy, not an official Microsoft limit.
# A 429 keeps the process/container alive, persists progress, then retries only
# the unfinished fragment after 15m, 30m, 60m, then 120m (+0..10% jitter).
http_429_cooldown_seconds = [900, 1800, 3600, 7200]
http_429_jitter_ratio = 0.10
auto_resume_429 = true
persist_cooldown = true
# Preserve the locally scheduled cooldown across Docker/Node restarts. This
# avoids using a restart as a way to reset server-side rate limiting.
immediate_resume_without_retry_after = false
max_429_events_per_run = 3
http_403_max_retries = 1
circuit_half_open_requests = 1
stop_on_http_429 = true
stop_on_http_403 = true

[segmentation]
max_chars = 700
min_chars = 150
prefer_paragraphs = true
prefer_sentences = true

[audio]
sentence_pause_ms = 0
paragraph_pause_ms = 120
mp3_quality = "2"

[fb2]
enabled = true
split_by = "chapter"
max_section_depth = 1
include_epigraphs = true
include_poems = true
include_notes = false
speak_chapter_titles = false

[chapter_detection]
mode = "auto"
min_words = 1500
target_max_words = 5000
preserve_existing_chapters = true
preserve_original_text = true
review_uncertain_boundaries = true

[pdf]
# PDF.js extracts a text layer. Scanned PDFs require an external OCR workflow.
max_bytes = 262144000
